<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Open-Meteo Weather & Air Quality Dashboard</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header>
            <div class="logo">Weather & Air Quality Explorer</div>
            <nav>
                <button id="nav-weather" class="nav-btn active" type="button" aria-controls="content-display">Weather
                    Forecast</button>
                <button id="nav-air" class="nav-btn" type="button" aria-controls="content-display">Air Quality
                    Data</button>
            </nav>
        </header>

        <main class="container">
            <section id="view-title" class="view-header"></section>
            <div id="status-message" class="status-message" role="status" aria-live="polite"></div>
            <div id="content-display" class="content-display" aria-live="polite"></div>
        </main>

        <footer>
            <p>Data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo API</a></p>
        </footer>

        <script src="app.js"></script>
    </body>

</html>
